[project]
name = "ossuary"
version = "0.1.0"
description = "Find health issues in local LLM agent session transcripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.19,<3",
    "pydantic>=2.9",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ossuary = "ossuary.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossuary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
