[project]
name = "ossuary"
version = "0.1.0"
description = "Find health issues in local LLM agent session transcripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.19,<3",
    "pydantic>=2.9",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Inference without an Anthropic API key. Each SDK inherits the credentials the
# corresponding CLI already holds, so a Claude Pro/Max or Copilot subscription
# is enough on its own.
claude-code = ["claude-agent-sdk>=0.2"]
copilot = ["github-copilot-sdk>=1.0"]
# The stdio MCP server, which lets Claude Code or Copilot CLI drive a scan
# themselves rather than Ossuary calling out to a model.
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "claude-agent-sdk>=0.2", "mcp>=1.2"]

[project.scripts]
ossuary = "ossuary.cli:app"
ossuary-mcp = "ossuary.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossuary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
